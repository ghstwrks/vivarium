name: Run the action against examples/hello

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Package.swift"
      - "action.yml"
      - "Scripts/action/**"
      - "examples/hello/**"
      - ".github/workflows/dogfood.yml"

# Prevent concurrent jobs from sharing the runner's VM resources.
concurrency:
  group: vivarium-dogfood
  cancel-in-progress: false

jobs:
  hello:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Build the viv under test
        run: |
          set -euo pipefail
          swift build -c release
          codesign -s - --entitlements Vivarium.entitlements -f .build/release/viv
          codesign -d --entitlements - .build/release/viv 2>&1 \
            | grep -q com.apple.security.virtualization

      - name: Unit tests
        run: swift test

      - id: pass
        uses: ./
        with:
          viv-path: ${{ github.workspace }}/.build/release/viv
          working-directory: examples/hello
          env: |
            GREETING=hello from the workflow
          artifact-name: dogfood-pass

      - name: The passing run reported what it should have
        env:
          STATUS: ${{ steps.pass.outputs.status }}
          PASSED: ${{ steps.pass.outputs.passed }}
          TEST_EXIT: ${{ steps.pass.outputs.test-exit-code }}
          ARTIFACTS: ${{ steps.pass.outputs.artifact-count }}
          RESULTS: ${{ steps.pass.outputs.results-path }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 was \"$2\", expected \"$3\""
              fail=1
            fi
          }
          check status "$STATUS" passed
          check passed "$PASSED" true
          check test-exit-code "$TEST_EXIT" 0
          check artifact-count "$ARTIFACTS" 2
          grep -q "hello from the workflow" "$RESULTS/artifacts/greeting.txt" \
            || { echo "::error::the env input did not reach the guest"; fail=1; }
          exit $fail

      - id: broken
        uses: ./
        with:
          viv-path: ${{ github.workspace }}/.build/release/viv
          working-directory: examples/hello
          command: |
            echo "this run is supposed to fail"
            exit 3
          fail-on-test-failure: false
          artifact-name: dogfood-fail

      - name: The failing run reported a failure, not an error
        env:
          STATUS: ${{ steps.broken.outputs.status }}
          PASSED: ${{ steps.broken.outputs.passed }}
          EXIT: ${{ steps.broken.outputs.exit-code }}
          TEST_EXIT: ${{ steps.broken.outputs.test-exit-code }}
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 was \"$2\", expected \"$3\""
              fail=1
            fi
          }
          check status "$STATUS" failed
          check passed "$PASSED" false
          # 1, not 70: the tests ran and gave an answer. Confusing the two is
          # the failure mode this whole exit-code contract exists to prevent.
          check exit-code "$EXIT" 1
          check test-exit-code "$TEST_EXIT" 3
          exit $fail
